[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trialmatch"
version = "0.1.0"
description = "Claude-powered agent that matches synthetic FHIR patients to recruiting trials on ClinicalTrials.gov, with criterion-level evidence."
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.8,<3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.28,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
trialmatch = "trialmatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
